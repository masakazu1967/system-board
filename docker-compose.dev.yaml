services:
  postgres:
    image: postgres:16.4  # PostgreSQL 16 LTS version
    container_name: system-board-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  eventstore:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:latest  # Latest stable version of EventStore
    environment:
      KURRENTDB_CLUSTER_SIZE: 1
      KURRENTDB_RUN_PROJECTIONS: All
      KURRENTDB_START_STANDARD_PROJECTIONS: true
      KURRENTDB_EXT_TCP_PORT: ${KURRENTDB_TCP_PORT}
      KURRENTDB_HTTP_PORT: ${KURRENTDB_HTTP_PORT}
      KURRENTDB_INSECURE: true
      KURRENTDB_ENABLE_EXTERNAL_TCP: true
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: true
    ports:
      - "${KURRENTDB_TCP_PORT}:${KURRENTDB_TCP_PORT}"
      - "${KURRENTDB_HTTP_PORT}:${KURRENTDB_HTTP_PORT}"
    volumes:
      - kurrentdb-volume-data:/var/lib/kurrentdb
      - kurrentdb-volume-log:/var/log/kurrentdb
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${KURRENTDB_HTTP_PORT}/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.0  # Latest stable Redis version
    container_name: system-board-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    # Using Confluent CP for better Kafka integration and enterprise features
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: system-board-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT}:${ZOOKEEPER_PORT}"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  kafka:
    # Using Confluent CP for better tooling and Kafka management features
    image: confluentinc/cp-kafka:7.7.0
    container_name: system-board-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:${KAFKA_PORT} --list"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
  kurrentdb-volume-data:
  kurrentdb-volume-log:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data: